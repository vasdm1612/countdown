const sealedAnswers=new Map(); // Local-only answers, never transmitted to the host until reveal.
const PROFILE_KEY='tileTimerProfilesV3';
function readProfiles(){try{const x=JSON.parse(localStorage.getItem(PROFILE_KEY)||'[]');return Array.isArray(x)?x.filter(p=>p?.id&&p.stats):[]}catch(e){return []}}
function writeProfiles(p){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(p))}catch(e){showToast('Storage is unavailable')}}
function selectedProfileId(){try{return localStorage.getItem('tileTimerActiveProfile')||''}catch(e){return ''}}
function setSelectedProfileId(id){try{localStorage.setItem('tileTimerActiveProfile',id)}catch(e){}}
function activeProfile(){return readProfiles().find(p=>p.id===selectedProfileId())||null}
function createProfile(name){name=String(name||'').trim().slice(0,20);if(!name)return null;const p={id:uid(),name,rating:1000,stats:{played:0,wins:0,points:0,exact:0,bestWord:0},matches:[]};const all=readProfiles();all.push(p);writeProfiles(all);setSelectedProfileId(p.id);saveName(name);return p}
function ensureProfile(name){let p=activeProfile();if(!p)p=createProfile(name||'Player');return p}
function profileStatsHtml(p){return `<div class="stats-grid"><div><b>${Math.round(p.rating)}</b><small>${t('rating')}</small></div><div><b>${p.stats.played||0}</b><small>${t('played')}</small></div><div><b>${p.stats.wins||0}</b><small>${t('wins')}</small></div><div><b>${p.stats.points||0}</b><small>${t('pointsTotal')}</small></div><div><b>${p.stats.exact||0}</b><small>${t('exactTotal')}</small></div><div><b>${p.stats.bestWord||0}</b><small>${t('bestWord')}</small></div></div>`}
function profilePanel(){const all=readProfiles(),current=activeProfile();return `<div class="options-panel"><h3>${t('profile')}</h3><p class="tiny">${t('profileHint')}</p><div class="field"><select id="profileSelect"><option value="">${t('guestProfile')}</option>${all.map(p=>`<option value="${p.id}" ${current?.id===p.id?'selected':''}>${esc(p.name)} · ${Math.round(p.rating)}</option>`).join('')}</select></div>${current?profileStatsHtml(current):''}<div class="profile-actions">${current?`<button type="button" class="quiet sm" data-action="profile-export">${t('exportProfile')}</button>`:''}<label class="quiet sm profile-import">${t('importProfile')}<input type="file" id="profileImport" accept="application/json,.json" hidden></label></div><form id="createProfileForm" class="profile-create"><input id="profileName" maxlength="20" placeholder="${t('profileName')}" required><button type="submit" class="quiet sm">${t('createProfile')}</button></form><details class="help"><summary>${t('profiles')}</summary>${[...all].sort((a,b)=>b.rating-a.rating).map((p,i)=>`<div class="profile-rank">${i+1}. ${esc(p.name)} <b>${Math.round(p.rating)}</b> · ${p.stats.played||0} ${t('played')}</div>`).join('')||t('guestProfile')}</details><p class="tiny">${t('profileLocal')}</p></div>`}
function exportProfile(){const p=activeProfile();if(!p)return;const blob=new Blob([JSON.stringify({format:'tile-timer-profile-v1',profile:p},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tile-timer-profile.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importProfile(file){try{if(!file||file.size>1000000)throw Error();const data=JSON.parse(await file.text()),p=data.profile;if(data.format!=='tile-timer-profile-v1'||!p||typeof p.name!=='string'||!p.stats||typeof p.stats!=='object'||!Array.isArray(p.matches)||!Number.isFinite(p.rating))throw Error();const own={id:uid(),name:p.name.trim().slice(0,20)||'Player',rating:Math.max(100,Math.min(3000,Math.round(p.rating))),stats:{played:Math.max(0,Math.floor(Number(p.stats.played)||0)),wins:Math.max(0,Math.floor(Number(p.stats.wins)||0)),points:Math.max(0,Math.floor(Number(p.stats.points)||0)),exact:Math.max(0,Math.floor(Number(p.stats.exact)||0)),bestWord:Math.max(0,Math.floor(Number(p.stats.bestWord)||0))},matches:p.matches.filter(x=>typeof x==='string'&&x.length<40).slice(-500)};const arr=readProfiles();arr.push(own);writeProfiles(arr);setSelectedProfileId(own.id);render()}catch(e){showToast(t('importError'))}}
function recordFinished(){if(!S||S.phase!=='finished'||!S.ratedEffective||!S.matchId)return;const p=activeProfile();if(!p)return;const me=S.players.find(x=>x.id===myId && x.profileId===p.id);if(!me)return;const all=readProfiles(),own=all.find(x=>x.id===p.id);if(!own||own.matches.includes(S.matchId))return;const scores=calculateScores(),max=Math.max(...Object.values(scores));own.stats.played++;if((scores[myId]||0)===max)own.stats.wins++;own.stats.points+=scores[myId]||0;for(const r of S.history){const e=r.submissions?.[myId]?evaluate(r,r.submissions[myId].text):{ok:false};if(e.ok&&r.kind==='numbers'&&e.dist===0)own.stats.exact++;if(e.ok&&r.kind==='letters'&&r.flags?.[myId]!==false)own.stats.bestWord=Math.max(own.stats.bestWord,e.len)}own.rating=Math.max(100,Math.round((own.rating||1000)+(S.ratingDeltas?.[myId]||0)));own.matches.push(S.matchId);own.matches=own.matches.slice(-500);writeProfiles(all);}
function ratingDeltas(){const result=Object.fromEntries(S.players.map(p=>[p.id,0]));if(!S.ratedEffective||S.players.length<2)return result;const scores=calculateScores();for(const a of S.players){let delta=0;for(const b of S.players){if(a.id===b.id)continue;const actual=scores[a.id]>scores[b.id]?1:scores[a.id]===scores[b.id]?.5:0;const expected=1/(1+10**((b.rating-a.rating)/400));delta+=24*(actual-expected)/(S.players.length-1)}result[a.id]=Math.round(delta)}return result}

function tinySound(freq=660,dur=.07){if(!sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);o.onended=()=>a.close()}catch(e){}}

function pickHtml(){const r=S.round;if(r.kind==='letters'){const{min,max,n}=letterBounds(),vc=r.tiles.filter(x=>isVowel(x,S.language)).length,cc=r.tiles.length-vc;return `<p class="subtle">${t(isAuthority()?'pickLetters':'hostPickingLetters')} ${min}–${max} ${t('vowels')}.</p>${tileRow(r.tiles,n,'letters')}<div class="roundmeta">${vc} ${t('vowels')} · ${cc} ${t('consonants')}</div>${isAuthority()?`<div class="rowbtn"><button class="button alt" data-action="vowel" ${r.tiles.length>=n||vc>=max?'disabled':''}>${t('vowel')}</button><button class="button" data-action="consonant" ${r.tiles.length>=n||cc>=n-min?'disabled':''}>${t('consonant')}</button><button class="quiet" data-action="autofill" ${r.tiles.length>=n?'disabled':''}>${t('autofill')}</button></div><div class="rowbtn"><button class="button" data-action="begin" ${r.tiles.length!==n?'disabled':''}>${t('startTimer',{n:S.duration})}</button></div>`:`<div class="notice">${t('waitClock')}</div>`}`}
 return `<p class="subtle">${t(isAuthority()?'pickNumbers':'hostPickingNumbers')} ${S.numberCount} ${t('numbers').toLowerCase()}</p>${tileRow(r.tiles,S.numberCount,'numbers')}${r.target!=null?`<div class="target">${r.target}</div><div class="roundmeta">${t('target')}</div>`:''}${isAuthority()?`<div class="rowbtn">${[0,1,2,3,4].filter(i=>i<=S.numberCount).map(i=>`<button class="quiet ${r.bigCount===i?'active':''}" data-action="large" data-count="${i}">${i} ${t('large')}</button>`).join('')}</div><div class="rowbtn"><button class="button alt" data-action="deal">${t('deal')}</button><button class="button" data-action="begin" ${r.tiles.length!==S.numberCount?'disabled':''}>${t('startTimer',{n:S.duration})}</button></div>`:`<div class="notice">${t('waitClock')}</div>`}`;
}
function tokenize(raw){const toks=[];const re=/\s*(\d+|[()+*×÷/−^√-])\s*/gy;let pos=0,m;while(pos<raw.length){re.lastIndex=pos;m=re.exec(raw);if(!m)return [];toks.push(m[1]);pos=re.lastIndex}return toks}
function calcCounts(){const counts=new Map();for(const token of tokenize($('#answer')?.value??drafts[S.index]??''))if(/^\d+$/.test(token))counts.set(+token,(counts.get(+token)||0)+1);return counts}
function calculatorHtml(draft){const used=new Map();for(const token of tokenize(draft))if(/^\d+$/.test(token))used.set(+token,(used.get(+token)||0)+1);
 const occurrences=new Map();const nums=S.round.tiles.map((n,i)=>{const index=occurrences.get(n)||0;occurrences.set(n,index+1);return `<button type="button" class="calc-key calc-number" data-calc="${n}" data-tile="${i}" ${index<(used.get(n)||0)?'disabled':''}>${n}</button>`}).join('');
 const ops=['+','−','×','÷','^','√','(',')'].map(x=>`<button type="button" class="calc-key calc-op" data-calc="${x}">${x}</button>`).join('');
 const tokens=tokenize(draft);
 return `<div class="calculator"><h4>${t('builder')}</h4><p class="hint">${t('builderHelp')}</p><div class="calc-pad">${nums}${ops}</div><div class="rowbtn"><button type="button" class="quiet sm" data-calc-action="backspace">⌫ ${t('backspace')}</button><button type="button" class="quiet sm" data-calc-action="clear">${t('clear')}</button></div><div class="tokens" id="expressionTokens" aria-label="${t('builder')}">${tokens.length?tokens.map((token,i)=>`<button type="button" class="expr-token ${i===calcSelection?'chosen':''}" data-token="${i}" draggable="true" title="${t('tokenHint')}">${esc(token)}</button>`).join(''):`<span class="hint">${t('noTokens')}</span>`}</div><div class="rowbtn"><button type="button" class="quiet sm" data-calc-action="left" ${calcSelection<=0||calcSelection>=tokens.length?'disabled':''}>${t('moveLeft')}</button><button type="button" class="quiet sm" data-calc-action="right" ${calcSelection<0||calcSelection>=tokens.length-1?'disabled':''}>${t('moveRight')}</button><button type="button" class="quiet sm" data-calc-action="remove" ${calcSelection<0||calcSelection>=tokens.length?'disabled':''}>${t('deleteToken')}</button></div>${S.liveCalc?`<div class="calc-steps" id="calcSteps">${previewSteps(draft)}</div>`:''}</div>`
}
function previewSteps(expr){if(!expr.trim())return `<small>${t('calcWait')}</small>`;let s=expr.trim();for(let k=0;k<5;k++){try{const x=evalMath(s,S.round.tiles);return `<b>${t('calcResult')}: ${x.value}</b>${x.steps.length?`<ol>${x.steps.map(z=>`<li>${esc(z)}</li>`).join('')}</ol>`:''}`}catch(e){s=s.replace(/[+−×÷*/^√(\s]+$/g,'').trim();if(!s)break}}return `<small>${t('calcWait')}</small>`}
function playHtml(){const r=S.round;const puzzle=r.kind==='numbers'?`<div class="target">${r.target}</div><div class="roundmeta">${t('target')}</div>${tileRow(r.tiles,S.numberCount,'numbers')}`:tileRow(r.tiles,r.kind==='conundrum'?9:S.letterCount,'letters');const me=getMySubmission();const hint=r.kind==='numbers'?t('numberHint')+' '+t('specialOps')+' '+t('baseFour'):r.kind==='conundrum'?t('anagramHint'):t('lettersHint');const draft=drafts[S.index]??me?.text??'';return `${puzzle}${r.bonusLetter?`<div class="bonus">${t('bonusNotice',{letter:r.bonusLetter})} · ${t('bonusInfo')}</div>`:''}<div class="timerwrap"><div id="timerArc" class="timer"><div id="timerText" class="timerinner">${S.duration}</div></div><div class="roundmeta">${t('secondsLeft')}</div></div><div class="answerbox"><h3>${t(r.kind==='numbers'?'calcTitle':r.kind==='conundrum'?'anagramTitle':'longest')}</h3><div class="hint">${hint}</div><form id="answerForm"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="140" aria-label="${t('answer')}" placeholder="${t(r.kind==='numbers'?'numberPlaceholder':r.kind==='conundrum'?'anagramPlaceholder':'wordPlaceholder')}" value="${esc(draft)}" ${r.kind==='conundrum'&&me?'disabled':''}><button class="button" type="submit" ${r.kind==='conundrum'&&me?'disabled':''}>${t(me?'update':'lock')} ↗</button></form>${r.kind==='numbers'?calculatorHtml(draft):''}<div class="answerstate" id="answerState">${me?`✓ ${t(r.kind==='conundrum'?'guessLocked':'received')}`:t('noneSubmitted')}</div></div><div class="roundmeta">${t('submittedCount',{n:Object.keys(r.submissions||{}).length,all:S.players.length})}</div>`}

function resultRow(r,p,awards){const a=r.submissions[p.id],result=a?evaluate(r,a.text):{ok:false,reason:t('noAnswer')};const valid=result.ok&&(r.kind!=='letters'||wordIsAccepted(r,p.id));const bad=r.kind==='letters'&&a&&!valid;const word=a?.text||'';const url=`https://${S.language==='ru'?'ru':'en'}.wiktionary.org/wiki/${encodeURIComponent(word.toLowerCase())}`;const counts=voteCounts(r,p.id);const open=S.phase==='results'&&Date.now()<r.voteEndsAt;

// Online answers use commit/reveal: the hosting player's browser receives only a SHA-256
// commitment until the common deadline. Revealed plaintext is verified after the timer.
// This equalizes the normal client and protocol experience, not maliciously modified clients.
const answerKey=()=>`${S.matchId}:${S.index}`;
async function fingerprint(pid,text,salt){

function acceptCommit(pid,hash){

}

}
function updateClock(){if(!S||view!=='room'||S.phase!=='play')return;const left=Math.max(0,Math.ceil((S.round.endsAt-Date.now())/1000));const el=$('#timerText'),ring=$('#timerArc');if(el)el.textContent=String(left).padStart(2,'0');if(ring)ring.style.background=`conic-gradient(${left<=5?'var(--red)':'var(--gold)'} ${Math.max(0,(S.round.endsAt-Date.now())/(S.duration*1000))*360}deg,#263852 0deg)`;if(left!==lastTick){if(lastTick!=null&&left<=5&&left>0)tinySound(400,.025);lastTick=left}}
function exampleSolution(nums,target){let best={dist:Infinity,expr:'',value:0},visited=new Set(),count=0;function recurse(arr){if(count++>80000)return false;const key=arr.map(n=>n.v).sort((a,b)=>a-b).join(',');if(visited.has(key))return false;visited.add(key);for(const n of arr){const d=Math.abs(n.v-target);if(d<best.dist){best={dist:d,expr:n.e,value:n.v};if(d===0)return true}}if(arr.length<2)return false;for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const a=arr[i],b=arr[j],rest=arr.filter((_,k)=>k!==i&&k!==j);const ops=[{v:a.v+b.v,e:`(${a.e}+${b.e})`},{v:a.v*b.v,e:`(${a.e}×${b.e})`},{v:a.v-b.v,e:`(${a.e}−${b.e})`},{v:b.v-a.v,e:`(${b.e}−${a.e})`}];if(b.v&&a.v%b.v===0)ops.push({v:a.v/b.v,e:`(${a.e}÷${b.e})`});if(a.v&&b.v%a.v===0)ops.push({v:b.v/a.v,e:`(${b.e}÷${a.e})`});for(const op of ops){if(op.v<=0||op.v>99999||!Number.isSafeInteger(op.v))continue;if(recurse([...rest,op]))return true}}return false}recurse(nums.map(v=>({v,e:String(v)})));return best}
function publish(){if(mode==='host')for(const c of connections.values())sendState(c.conn,c.playerId);render()}
function publicState(forId){const state=JSON.parse(JSON.stringify(S));if(['play','reveal'].includes(state.phase)&&state.round){delete state.round.reveals;delete state.round.solution;delete state.round.baseSolution;for(const id of Object.keys(state.round.submissions))state.round.submissions[id]={hasAnswer:true,ts:state.round.submissions[id].ts}}return state}
function sendState(conn,id){if(conn.open)try{conn.send({type:'state',state:publicState(id)})}catch(e){console.warn(e)}}
function applyState(data){if(!data||!Array.isArray(data.players)||!Array.isArray(data.schedule)||!['ru','en'].includes(data.language)||!Number.isFinite(data.duration))return;S=data;recordFinished();setView('room');if(S.phase==='reveal')sendMyReveal()}
function attachHostConnection(conn){let id=null;conn.on('data',msg=>{if(!msg||typeof msg!=='object')return;if(!id){if(msg.type!=='hello')return;const name=String(msg.name||t('player')).trim().slice(0,20)||t('player');id=String(msg.playerId||'').replace(/[^A-Za-z0-9]/g,'').slice(0,20);if(!id){conn.close();return}if(!S.players.some(p=>p.id===id)){if(S.players.length>=6||S.rated&&S.phase!=='lobby'){conn.send({type:'error',message:t('roomFull')});conn.close();return}S.players.push({id,name,profileId:String(msg.profileId||'').slice(0,30),rating:Math.max(100,Math.min(3000,Number(msg.rating)||1000))})}else S.players.find(p=>p.id===id).name=name;connections.set(conn.peer,{conn,playerId:id});sendState(conn,id);publish();return}if(msg.type==='commit')acceptCommit(id,String(msg.hash||''));else if(msg.type==='reveal')acceptReveal(id,msg.text,msg.salt);else if(msg.type==='vote')castVote(id,String(msg.target||''),!!msg.approve)});conn.on('close',()=>{connections.delete(conn.peer);publish()});conn.on('error',()=>{connections.delete(conn.peer);publish()})}
function createRoom(name,options){if(typeof window.Peer!=='function'){lastKnownError=t('noLibrary');setView('host-screen');return}cleanup();const profile=ensureProfile(name);myName=name||profile.name;myId=uid();saveName(myName);mode='host';const room=code();pendingCode=room;S=basicState(room,myName,options);view='connecting';lastKnownError='';render();peer=new Peer('tiletimer-'+room,{debug:0});peer.on('open',()=>{view='room';render();showToast(t('ready'))});peer.on('connection',attachHostConnection);peer.on('error',e=>{lastKnownError=e.type==='unavailable-id'?t('idTaken'):t('roomError')+' '+(e.message||e.type);cleanup();mode='none';setView('host-screen')});peer.on('disconnected',()=>showToast(t('signalLost')))}
function joinRoom(name,room){if(typeof window.Peer!=='function'){lastKnownError=t('noLibrary');setView('join-screen');return}cleanup();const profile=ensureProfile(name);myProfileId=profile.id;myName=name;myId=sessionPlayerId(room);saveName(name);mode='guest';pendingCode=room;lastKnownError='';view='connecting';render();peer=new Peer(undefined,{debug:0});const fail=msg=>{lastKnownError=msg;cleanup();mode='none';setView('join-screen')};peer.on('open',()=>{hostConn=peer.connect('tiletimer-'+room,{reliable:true});let received=false;hostConn.on('open',()=>hostConn.send({type:'hello',name,playerId:myId,profileId:profile.id,rating:profile.rating}));hostConn.on('data',msg=>{if(msg?.type==='state'){received=true;applyState(msg.state)}else if(msg?.type==='error')fail(msg.message)});hostConn.on('close',()=>{if(!received)fail(t('notFound'));else{showToast(t('connectionLost'));lastKnownError=t('rejoin');cleanup();mode='none';setView('join-screen')}});hostConn.on('error',()=>fail(t('connectError')));setTimeout(()=>{if(mode==='guest'&&!received)fail(t('hostTimeout'))},15000)});peer.on('error',e=>fail(t('connectError')+' '+(e.message||e.type)))}
function cleanup(){try{hostConn?.close();peer?.destroy()}catch(e){}hostConn=null;peer=null;connections.clear();S=null;drafts={};sealedAnswers.clear();lastTick=null;calcSelection=-1;submissionSequence=0}
function readOptions(prefix){const get=id=>$(`#${prefix}${id}`),language=get('Language')?.value||uiLang,format=get('Format')?.value||'quick',duration=clampDuration(get('Duration')?.value),letterCount=clampLetter(get('LetterCount')?.value),numberCount=clampNumber(get('NumberCount')?.value),liveCalc=!!get('LiveCalc')?.checked,bonus=!!get('Bonus')?.checked,autoHost=!!get('AutoHost')?.checked,rated=!!get('Rated')?.checked;for(const [k,v]of Object.entries({WordLanguage:language,Format:format,Duration:duration,LetterCount:letterCount,NumberCount:numberCount,LiveCalc:liveCalc,Bonus:bonus,AutoHost:autoHost,Rated:rated}))saveSetting('tile'+k,v);return{language,format,duration,letterCount,numberCount,liveCalc,bonus,autoHost,rated}}
function startSolo(options){cleanup();const p=ensureProfile(savedName()||'Игрок');myId=uid();myName=p.name;mode='solo';S=basicState('SOLO',myName,{...options,rated:false});setView('room')}
function askLeave(){if(view==='home')return;if(S&&!confirm(t('leaveConfirm')))return;cleanup();mode='none';lastKnownError='';try{history.replaceState(null,'',location.pathname)}catch(e){}setView('home')}
function setDraft(value){if(!S||S.phase!=='play')return;drafts[S.index]=value;const input=$('#answer');if(input)input.value=value;refreshCalculator()}
function refreshCalculator(){if(!S||S.round?.kind!=='numbers')return;const input=$('#answer');if(!input)return;const box=$('.calculator');if(!box)return;const wrap=document.createElement('div');wrap.innerHTML=calculatorHtml(input.value);box.replaceWith(wrap.firstElementChild)}
function modifyCalc(action,val){if(!S||S.phase!=='play'||S.round.kind!=='numbers')return;const text=$('#answer')?.value||'';const tokens=tokenize(text);
 if(action==='append'){if(/^\d+$/.test(val)){const available=S.round.tiles.filter(n=>n===+val).length,used=tokens.filter(x=>x===String(+val)).length;if(used>=available)return}tokens.push(val);calcSelection=tokens.length-1}
 else if(action==='backspace'){tokens.pop();calcSelection=-1}
 else if(action==='clear'){tokens.length=0;calcSelection=-1}
 else if(action==='left'&&calcSelection>0){[tokens[calcSelection-1],tokens[calcSelection]]=[tokens[calcSelection],tokens[calcSelection-1]];calcSelection--}
 else if(action==='right'&&calcSelection>=0&&calcSelection<tokens.length-1){[tokens[calcSelection+1],tokens[calcSelection]]=[tokens[calcSelection],tokens[calcSelection+1]];calcSelection++}
 else if(action==='remove'&&calcSelection>=0){tokens.splice(calcSelection,1);calcSelection=-1}
 // Preserve token boundaries when keypad digits have been clicked; manual input stays supported.
 setDraft(tokens.join(' '));
}
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='createProfileForm'){const name=$('#profileName')?.value;const p=createProfile(name);if(p){render();showToast(p.name)}return}if(e.target.id==='setupForm'){const name=($('#nick')?.value||'').trim().slice(0,20);if(!name){showToast(t('enterName'));return}if(view==='host-screen'){const opts=readOptions('host');createRoom(name,opts)}else{const c=($('#joincode').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==6){showToast(t('sixCode'));return}joinRoom(name,c)}return}
 if(e.target.id==='answerForm'){const value=$('#answer').value.trim();if(!value){showToast(t('typeAnswer'));return}const r=S.round,check=evaluate(r,value);if(r.kind!=='conundrum'&&!check.ok){$('#answerState').textContent=check.reason;$('#answerState').style.color='var(--red)';return}const p=S.language==='ru'?/^[А-ЯЁ]{9}$/u:/^[A-Z]{9}$/;if(r.kind==='conundrum'&&!p.test(normalWord(value))){showToast(t('nineLetters'));return}commitAnswer(value)}
});
app.addEventListener('click',e=>{const token=e.target.closest('[data-token]');if(token){calcSelection=+token.dataset.token;refreshCalculator();return}const cb=e.target.closest('[data-calc]');if(cb){modifyCalc('append',cb.dataset.calc);return}const ca=e.target.closest('[data-calc-action]');if(ca){modifyCalc(ca.dataset.calcAction);return}
 const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
 if(act==='solo')startSolo(readOptions('solo'));
 else if(act==='host-screen'||act==='join-screen'){if(act==='host-screen'&&$('#soloLanguage'))readOptions('solo');lastKnownError='';setView(act)}
 else if(act==='back'){cleanup();mode='none';setView('home')}
 else if(act==='profile-export')exportProfile()
 else if(act==='copy'){if(location.protocol==='file:'){showToast(t('publishFirst'));return}const u=roomUrl();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u).then(()=>showToast(t('copied'))).catch(()=>prompt(t('copyPrompt'),u));else prompt(t('copyPrompt'),u)}
 else if(act==='vote-yes'||act==='vote-no'){if(isAuthority())castVote(myId,b.dataset.player,act==='vote-yes');else if(hostConn?.open)hostConn.send({type:'vote',target:b.dataset.player,approve:act==='vote-yes'});return}
 else if(act==='solve'&&S?.phase==='results'&&S.round?.kind==='numbers'){const out=$('#solverOut');out.textContent=t('searching');setTimeout(()=>{if(!S||S.phase!=='results'||S.round.kind!=='numbers')return;const x=exampleSolution(S.round.tiles,S.round.target);const o=$('#solverOut');if(o)o.textContent=`${t('example')} ${x.expr} = ${x.value} (${x.dist===0?t('exact'):t('distance',{n:x.dist})})`},40)}
 else if(!isAuthority())return;
 else if(act==='start-game')nextRound();
 else if(act==='vowel'||act==='consonant')pickLetter(act);
 else if(act==='autofill')autoFill();
 else if(act==='large'){S.round.bigCount=Number(b.dataset.count);S.round.tiles=[];S.round.target=null;publish()}
 else if(act==='deal')dealNumbers();
 else if(act==='begin')beginClock();
 else if(act==='word-flag'){const pid=b.dataset.player;S.round.flags[pid]=S.round.flags[pid]===false?true:false;publish()}
 else if(act==='next')nextRound();
 else if(act==='rematch'){S.matchId=uid();S.index=-1;S.phase='lobby';S.history=[];S.round=null;S.ratedEffective=false;const previousDeltas=S.ratingDeltas||{};S.ratingDeltas={};const local=activeProfile();for(const p of S.players){p.rating=Math.max(100,(p.rating||1000)+(previousDeltas[p.id]||0));if(p.id===myId&&local)p.rating=local.rating}publish()}

});
let draggingToken=-1;
app.addEventListener('dragstart',e=>{const token=e.target.closest('[data-token]');if(!token)return;draggingToken=+token.dataset.token;e.dataTransfer?.setData('text/plain',String(draggingToken))});
app.addEventListener('dragover',e=>{if(e.target.closest('[data-token]'))e.preventDefault()});
app.addEventListener('drop',e=>{const token=e.target.closest('[data-token]');if(!token||draggingToken<0)return;e.preventDefault();const from=draggingToken,to=+token.dataset.token;const parts=tokenize($('#answer').value);if(from<parts.length&&to<parts.length){const [part]=parts.splice(from,1);parts.splice(to,0,part);calcSelection=to;setDraft(parts.join(' '))}draggingToken=-1});
app.addEventListener('change',e=>{if(e.target.id==='profileSelect'){setSelectedProfileId(e.target.value);render()}else if(e.target.id==='profileImport')importProfile(e.target.files?.[0])});
$('#uiLanguage').addEventListener('change',e=>{uiLang=e.target.value;saveSetting('tileUiLanguage',uiLang);render()});
$('#helpToggle').addEventListener('click',()=>{if(view==='home'){const d=$('.help');d.open=!d.open;d.scrollIntoView({behavior:'smooth',block:'nearest'})}else alert(t('rulesList').map(x=>x.replace(/<[^>]*>/g,'')).join('\n\n'))});
$('#soundToggle').addEventListener('click',()=>{sound=!sound;$('#soundToggle').textContent=t(sound?'on':'off');if(sound)tinySound(700,.1)});
$('#homeToggle').addEventListener('click',askLeave);
setInterval(()=>{updateClock();if(isAuthority()&&S?.phase==='play'&&Date.now()>=S.round.endsAt)endRound();if(isAuthority()&&S?.phase==='reveal'&&Date.now()>=S.round.revealEndsAt)finalizeReveal();if(isAuthority()&&S?.phase==='results'&&S.autoHost&&Date.now()>=S.round.autoAdvanceAt)nextRound();if(S?.phase==='results'&&S.round.kind==='letters'){const el=$('#voteStatus');if(el)el.textContent=Date.now()<S.round.voteEndsAt?t('voting',{n:Math.ceil((S.round.voteEndsAt-Date.now())/1000)}):t('votesClosed');const next=$('[data-action=next]');if(next&&Date.now()>=S.round.voteEndsAt)next.disabled=false}},150);
window.addEventListener('beforeunload',()=>{try{peer?.destroy()}catch(e){}});
const q=new URLSearchParams(location.search).get('room');if(q&&/^[A-Z0-9]{6}$/i.test(q)){pendingCode=q.toUpperCase();setView('join-screen')}else render();
</script>
